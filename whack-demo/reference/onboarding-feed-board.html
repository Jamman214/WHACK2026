<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Feed Board Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one column — headline card on top, board underneath, so the ball visibly drops from card to board */
:root{
  --bg:#ECEFF3; --surface:#F8F9FB; --ink:#13161B; --muted:#5E6675; --line:#C9CFD9;
  --peg:#8E97A8; --accent:#2F55F5; --accent-ink:#FFFFFF; --hollow:#ECEFF3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --ink:#E7EAF0; --muted:#98A1B2; --line:#2C323D;
  --peg:#5D6677; --accent:#7D97FF; --accent-ink:#0E1116; --hollow:#0E1116; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --ink:#E7EAF0; --muted:#98A1B2; --line:#2C323D;
  --peg:#5D6677; --accent:#7D97FF; --accent-ink:#0E1116; --hollow:#0E1116; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{font:500 14px var(--body);border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.blurb{margin:0;color:var(--muted);max-width:68ch}
.blurb b{color:var(--ink);font-weight:500}
.deck{display:flex;flex-direction:column;align-items:center;gap:14px}
.card{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;
  display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:0 6px 20px -12px rgba(0,0,0,.35)}
.card .cat{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card .hl{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.25;text-wrap:balance}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:auto}
.card.enter{animation:enter .28s ease-out}
@keyframes enter{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:500 14px var(--body);border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn kbd{font:500 11px var(--mono);opacity:.7}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.board{width:100%;max-width:720px;align-self:center;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.summary{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.summary b{color:var(--ink);font-weight:500}
.legend{display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.dot.s{background:var(--accent)} .dot.u{border:2px solid var(--accent);width:6px;height:6px}
.morph{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--line);overflow:hidden;pointer-events:none;box-sizing:border-box;
  font-family:var(--display);font-size:21px;padding:18px 22px;line-height:1.25}
@media (prefers-reduced-motion: reduce){.card.enter{animation:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">WHACK · onboarding prototype</div>
      <h1>Drop the headlines</h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-a" aria-selected="true" data-tab="a">Groups as buckets</button>
      <button class="tab" role="tab" id="tab-b" aria-selected="false" data-tab="b">Split board</button>
    </div>
  </header>

  <p class="blurb" id="blurb"></p>

  <div class="deck">
    <div class="card" id="card"></div>
    <div class="choices">
      <button class="btn primary" id="btn-seen"><kbd>←</kbd> In my feed</button>
      <button class="btn" id="btn-unseen">Not in my feed <kbd>→</kbd></button>
    </div>
  </div>

  <div class="board"><canvas id="cv-a"></canvas><canvas id="cv-b" hidden></canvas></div>

  <div class="foot">
    <div class="legend"><span><span class="dot s"></span>In my feed</span><span><span class="dot u"></span>Not in my feed</span></div>
    <div class="summary" id="summary"></div>
    <div class="choices">
      <button class="btn ghost" id="btn-demo">Play demo feed</button>
      <button class="btn ghost" id="btn-reset">Reset</button>
    </div>
  </div>
</div>

<script>
const CATS = ["Tech","Markets","Politics","Society","Food","Education","Work","Cities","Science","Africa & EM","Media","Law","Wellbeing","Resources"];
const DECK = [
  ["Tech","Ransomware attack halts hospital blood tests across London"],
  ["Politics","US midterm results reshape control of Congress"],
  ["Markets","Bond yields jump after a surprise inflation print"],
  ["Resources","Lithium price slump stalls new mine openings"],
  ["Food","Cocoa prices push chocolate costs to a record high"],
  ["Media","Deepfake audio clip spreads ahead of a national vote"],
  ["Work","Four-day week trial ends with most firms keeping it"],
  ["Science","Gene-edited rice doubles yield in drought trials"],
  ["Africa & EM","Mobile-money transfers in Kenya hit a new annual record"],
  ["Law","Court rules ride-hailing drivers are employees"],
  ["Education","Overseas university applications fall for a second year"],
  ["Cities","Night Tube expansion approved for two more lines"],
  ["Wellbeing","Waiting lists for talking therapies reach a new high"],
  ["Society","Council tax rises approved across 40 English councils"],
  ["Tech","EU fines a major app store over payment rules"],
  ["Markets","Retail traders pile back into AI chip stocks"],
  ["Science","Fusion lab reports its longest sustained plasma yet"],
  ["Politics","Coalition talks stall after an inconclusive election"],
];
const DEMO_SEEN = new Set(["Tech","Media","Resources","Markets"]);
const W = 480, H = 242;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const lerp = (a,b,p) => a + (b-a)*p;

/* ---------- heap: stacks balls in a wide bucket, near where each ball exits ---------- */
function heap(x0, w, yBot){
  const sp = 11, rowH = 10, cols = Math.floor(w/sp), h = Array(cols).fill(0), off = x0 + (w-cols*sp)/2 + sp/2;
  return {
    reset(){ h.fill(0); },
    place(ex){
      const c0 = Math.max(0, Math.min(cols-1, Math.round((ex-off)/sp)));
      let best = c0;
      for (let d=-3; d<=3; d++){ const c = c0+d; if (c<0||c>=cols) continue;
        if (h[c] < h[best] || (h[c]===h[best] && Math.abs(d) < Math.abs(best-c0))) best = c; }
      const y = yBot - 5.5 - h[best]*rowH; h[best]++;
      return {x: off + best*sp, y};
    }
  };
}
function funnel(ctx, cx, line){
  ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(cx-40,0); ctx.lineTo(cx-8,16); ctx.moveTo(cx+40,0); ctx.lineTo(cx+8,16); ctx.stroke();
}

/* ---------- Board A: five broad groups as buckets, path scripted to the article's group ---------- */
const GROUPS = [
  ["Tech & Media", ["Tech","Media"]],
  ["Money & Work", ["Markets","Work","Africa & EM"]],
  ["Power & Law", ["Politics","Law"]],
  ["Everyday life", ["Society","Education","Wellbeing","Cities"]],
  ["Science & Planet", ["Science","Resources","Food"]],
];
function boardA(){
  const cx = W/2, dx = 44, R = 9, y0 = 30, dy = 14, yB = 164, bH = 46, bw = 88, left = cx - 220;
  const heaps = GROUPS.map((_,k)=> heap(left + k*bw, bw, yB+bH));
  const seen = Array(GROUPS.length).fill(0), unseen = Array(GROUPS.length).fill(0);
  const groupOf = cat => GROUPS.findIndex(g => g[1].includes(cat));
  return {
    blurb:"<b>Groups as buckets.</b> The 14 categories roll up into five broad worlds, so the board stays readable. Solid balls are in your feed, hollow ones aren't. A bucket with only hollow balls is a blind spot. The card still shows the exact category for the map later.",
    reset(){ heaps.forEach(h=>h.reset()); seen.fill(0); unseen.fill(0); },
    path(cat, isSeen){
      const k = groupOf(cat), target = 2*k + Math.floor(Math.random()*2);
      const moves = Array(R).fill(0).map((_,i)=> i < target ? 1 : 0).sort(()=>Math.random()-.5);
      const pts = [{x:cx,y:6,d:0}, {x:cx,y:y0-7,d:220,fall:1}];
      let r = 0;
      for (let i=0;i<R;i++){ r += moves[i]; pts.push({x:cx+(r-(i+1)/2)*dx, y:y0+(i+1)*dy-7, d:120, arc:5}); }
      const p = heaps[k].place(pts[pts.length-1].x);
      isSeen ? seen[k]++ : unseen[k]++;
      pts.push({x:p.x, y:p.y, d:220, fall:1});
      return pts;
    },
    draw(ctx){
      const peg = tok("--peg"), line = tok("--line"), ink = tok("--ink"), acc = tok("--accent");
      funnel(ctx, cx, line);
      ctx.fillStyle = peg;
      for (let r=0;r<R;r++) for (let j=0;j<=r;j++){ ctx.beginPath(); ctx.arc(cx+(j-r/2)*dx, y0+r*dy, 2.5, 0, 7); ctx.fill(); }
      ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let k=0;k<=GROUPS.length;k++){ const x = left + k*bw; ctx.moveTo(x,yB); ctx.lineTo(x,yB+bH); }
      ctx.moveTo(left,yB+bH); ctx.lineTo(left+GROUPS.length*bw,yB+bH); ctx.stroke();
      ctx.textAlign = "center"; ctx.font = "500 9.5px 'IBM Plex Mono', monospace";
      GROUPS.forEach(([name], k)=>{
        ctx.fillStyle = (seen[k]===0 && unseen[k]>0) ? acc : ink;
        name.toUpperCase().replace(" & "," &\n").replace("EVERYDAY ","EVERYDAY\n").split("\n")
          .forEach((ln,li)=> ctx.fillText(ln, left + k*bw + bw/2, yB+bH+14+li*11));
      });
    },
    summary(){
      const total = seen.reduce((a,b)=>a+b,0) + unseen.reduce((a,b)=>a+b,0);
      if (!total) return "Sort a headline to start filling the buckets.";
      const blind = GROUPS.filter((_,k)=> seen[k]===0 && unseen[k]>0).map(g=>g[0]);
      return `<b>${seen.reduce((a,b)=>a+b,0)}</b> in your feed · blind spots: <b>${blind.length ? blind.join(", ") : "none yet"}</b>`;
    }
  };
}

/* ---------- Board B: one triangle split down the middle; the gate picks the half, chance does the rest ---------- */
function boardB(){
  const cx = W/2, dx = 40, R = 10, y0 = 36, dy = 13, yB = 166, bH = 46;
  const heaps = {seen: heap(cx-220, 220, yB+bH), unseen: heap(cx, 220, yB+bH)};
  const counts = {seen:0, unseen:0};
  let flip = 0, flipTarget = 0;
  return {
    blurb:"<b>Split board.</b> One triangle with a wall down the middle. Your answer tips the gate at the top, so the ball can only fall into that half. From there every bounce is random, and it lands in one of two buckets: in my feed or not.",
    reset(){ heaps.seen.reset(); heaps.unseen.reset(); counts.seen = counts.unseen = 0; flipTarget = 0; },
    path(cat, isSeen){
      const side = isSeen ? "seen" : "unseen", s = isSeen ? -1 : 1;
      flipTarget = s;
      const pts = [{x:cx,y:6,d:0}, {x:cx,y:16,d:160,fall:1}];
      let r = isSeen ? 0 : 1;
      pts.push({x:cx+(r-.5)*dx, y:y0+dy-7, d:200, arc:3});
      for (let i=1;i<R;i++){
        let n = r + (Math.random()<.5 ? 1 : 0);
        const ok = v => isSeen ? v < (i+1)/2 : v > (i+1)/2;
        if (!ok(n)) n = n===r ? r+1 : r;
        r = n;
        pts.push({x:cx+(r-(i+1)/2)*dx, y:y0+(i+1)*dy-7, d:120, arc:5});
      }
      const p = heaps[side].place(pts[pts.length-1].x);
      counts[side]++;
      pts.push({x:p.x, y:p.y, d:220, fall:1});
      return pts;
    },
    draw(ctx){
      const peg = tok("--peg"), line = tok("--line"), muted = tok("--muted"), ink = tok("--ink"), acc = tok("--accent");
      funnel(ctx, cx, line);
      ctx.beginPath(); ctx.moveTo(cx,30); ctx.lineTo(cx,yB+bH); ctx.stroke();
      ctx.fillStyle = peg;
      for (let r=0;r<R;r++) for (let j=0;j<=r;j++){ if (2*j===r) continue; ctx.beginPath(); ctx.arc(cx+(j-r/2)*dx, y0+r*dy, 2.5, 0, 7); ctx.fill(); }
      flip = lerp(flip, flipTarget, .18);
      ctx.save(); ctx.translate(cx,23); ctx.rotate(flip*.4); ctx.strokeStyle = acc; ctx.lineWidth = 3.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.stroke(); ctx.restore();
      ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(cx,23,2.5,0,7); ctx.fill();
      ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(cx-220,yB); ctx.lineTo(cx-220,yB+bH); ctx.lineTo(cx+220,yB+bH); ctx.lineTo(cx+220,yB); ctx.stroke();
      ctx.textAlign = "center"; ctx.fillStyle = muted; ctx.font = "500 10px 'IBM Plex Mono', monospace";
      ctx.fillText("IN MY FEED  ·  " + counts.seen, cx-110, yB+bH+15);
      ctx.fillText("NOT IN MY FEED  ·  " + counts.unseen, cx+110, yB+bH+15);
    },
    summary(){
      const s = counts.seen, u = counts.unseen;
      if (!s && !u) return "Sort a headline to tip the gate.";
      return `<b>${s}</b> in your feed · <b>${u}</b> outside it · ${Math.round(100*u/(s+u))}% of the sample is a blind spot`;
    }
  };
}

/* ---------- shared engine ---------- */
const tabs = { a:{board:boardA(), cv:document.getElementById("cv-a"), balls:[], i:0},
               b:{board:boardB(), cv:document.getElementById("cv-b"), balls:[], i:0} };
let active = "a";
const $ = id => document.getElementById(id);
const cardEl = $("card");

function sizeCanvas(cv){
  const dpr = devicePixelRatio || 1, w = cv.clientWidth || 900;
  cv.width = w*dpr; cv.height = w*(H/W)*dpr;
  cv.getContext("2d").setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
function renderCard(animate){
  const t = tabs[active], done = t.i >= DECK.length;
  $("btn-seen").disabled = $("btn-unseen").disabled = $("btn-demo").disabled = done;
  cardEl.innerHTML = done
    ? `<div class="cat">All ${DECK.length} sorted</div><div class="hl">That's your feed, mapped. Next stop: the Topic Atlas.</div><div class="meta">Press Reset to run it again</div>`
    : `<div class="cat">${DECK[t.i][0]}</div><div class="hl">${DECK[t.i][1]}</div><div class="meta">Sample headline · ${t.i+1} of ${DECK.length}</div>`;
  if (animate && !reduce){ cardEl.classList.remove("enter"); void cardEl.offsetWidth; cardEl.classList.add("enter"); }
  $("summary").innerHTML = t.board.summary();
}
function spawn(t, cat, isSeen){
  const pts = t.board.path(cat, isSeen);
  t.balls.push({pts, seen:isSeen, t0:performance.now(), total:pts.reduce((a,p)=>a+p.d,0)});
  $("summary").innerHTML = t.board.summary();
}
function choose(isSeen){
  const t = tabs[active]; if (t.i >= DECK.length) return;
  const [cat, hl] = DECK[t.i]; t.i++;
  if (reduce){ spawn(t,cat,isSeen); renderCard(false); return; }
  const r = cardEl.getBoundingClientRect(), cr = t.cv.getBoundingClientRect(), s = cr.width/W;
  const m = document.createElement("div"); m.className = "morph"; m.textContent = hl;
  Object.assign(m.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",borderRadius:"14px"});
  document.body.appendChild(m);
  const tx = cr.left + (W/2)*s - 7, ty = cr.top + 6*s - 7;
  m.animate([
    {left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",borderRadius:"14px",color:tok("--ink"),background:tok("--surface"),padding:"18px 22px"},
    {offset:.55,left:(r.left+r.width/2-30)+"px",top:(r.top+r.height/2-30)+"px",width:"60px",height:"60px",borderRadius:"50%",color:"transparent",background:tok(isSeen?"--accent":"--surface"),padding:"0"},
    {left:tx+"px",top:ty+"px",width:"14px",height:"14px",borderRadius:"50%",color:"transparent",background:tok(isSeen?"--accent":"--surface"),padding:"0"}
  ],{duration:520,easing:"cubic-bezier(.5,0,.3,1)"}).onfinish = ()=>{ m.remove(); spawn(t,cat,isSeen); };
  renderCard(true);
}
function ballPos(b, now){
  let e = now - b.t0;
  for (let i=1;i<b.pts.length;i++){
    const p = b.pts[i], q = b.pts[i-1];
    if (e <= p.d){ const k = e/p.d, ky = p.fall ? k*k : k;
      return {x:lerp(q.x,p.x,k), y:lerp(q.y,p.y,ky) - (p.arc||0)*Math.sin(Math.PI*k)}; }
    e -= p.d;
  }
  return b.pts[b.pts.length-1];
}
function frame(now){
  const t = tabs[active], ctx = t.cv.getContext("2d");
  ctx.clearRect(0,0,W,H);
  t.board.draw(ctx);
  const acc = tok("--accent"), hol = tok("--hollow");
  for (const b of t.balls){
    const p = ballPos(b, now);
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7);
    if (b.seen){ ctx.fillStyle = acc; ctx.fill(); }
    else { ctx.fillStyle = hol; ctx.fill(); ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke(); }
  }
  requestAnimationFrame(frame);
}
function setTab(k){
  active = k;
  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", b.dataset.tab===k));
  tabs.a.cv.hidden = k!=="a"; tabs.b.cv.hidden = k!=="b";
  sizeCanvas(tabs[k].cv);
  $("blurb").innerHTML = tabs[k].board.blurb;
  renderCard(false);
  try{ localStorage.setItem("feedboard-tab",k); }catch(e){}
}
document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=> setTab(b.dataset.tab));
$("btn-seen").onclick = ()=> choose(true);
$("btn-unseen").onclick = ()=> choose(false);
$("btn-reset").onclick = ()=>{ const t = tabs[active]; t.i = 0; t.balls = []; t.board.reset(); renderCard(true); };
$("btn-demo").onclick = ()=>{
  const t = tabs[active];
  while (t.i < DECK.length){
    const [cat] = DECK[t.i]; const delay = (t.i)*140; t.i++;
    const seen = DEMO_SEEN.has(cat) ? Math.random()<.85 : Math.random()<.15;
    setTimeout(()=> spawn(t,cat,seen), delay);
  }
  renderCard(true);
};
addEventListener("keydown", e=>{
  if (e.key==="ArrowLeft"){ e.preventDefault(); choose(true); }
  if (e.key==="ArrowRight"){ e.preventDefault(); choose(false); }
});
addEventListener("resize", ()=> sizeCanvas(tabs[active].cv));
let start = "a"; try{ start = localStorage.getItem("feedboard-tab") || "a"; }catch(e){}
setTab(start);
requestAnimationFrame(frame);
</script>

</body></html>
